name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-build:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: swift build --package-path native/macos

  windows-test:
    name: Windows tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test --manifest-path native/windows/Cargo.toml

  linux-build-and-test:
    name: Ubuntu native build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev libpulse-dev libcurl4-openssl-dev libjson-glib-dev
      - name: Build and test
        run: ./native/linux/build.sh --test
      - name: Build Ubuntu package
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Givoice-ubuntu-amd64
          path: dist-native/linux/Givoice-ubuntu-amd64.deb
