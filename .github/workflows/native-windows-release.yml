name: Native Windows release

on:
  push:
    tags:
      - 'windows-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing windows-vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-windows-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows x64
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^windows-v\d+\.\d+\.\d+$') {
            throw 'Tag must be windows-vMAJOR.MINOR.PATCH.'
          }
          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must already exist on origin.' }
          # The app shows this version in its tray menu.
          "GIVOICE_VERSION=$($env:RELEASE_TAG.Substring('windows-v'.Length))" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build portable executable
        shell: pwsh
        run: |
          ./native/windows/build.ps1
          if (-not (Test-Path 'dist-native\Givoice.exe')) { throw 'Native executable is missing.' }
          # A fixed file name lets the landing page link straight to the download.
          New-Item release -ItemType Directory -Force | Out-Null
          Copy-Item 'dist-native\Givoice.exe' 'release\Givoice-windows-x64.exe'
          $hash = (Get-FileHash 'release\Givoice-windows-x64.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Givoice-windows-x64.exe" | Set-Content 'release\SHA256SUMS' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release/Givoice-windows-x64.exe release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "Givoice Windows $GIVOICE_VERSION" --generate-notes
      - name: Redeploy landing page with the new Windows version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
